name: AgencyOS CI
on:
  push:
    branches: [integration, agencyos-prod]
  pull_request:
    branches: [integration]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax check
        run: |
          find apps/agencyos/backend -name "*.py" -not -path "*/__pycache__/*" -exec python3 -m py_compile {} \;
      - name: Svelte convention check
        run: |
          ! grep -rn "onclick=" src/lib/components/agencyos/ --include="*.svelte" || exit 1
      - name: Install deps
        # --legacy-peer-deps required: @tiptap/extension-bubble-menu and
        # extension-floating-menu are intentionally pinned to v2 (see
        # src/lib/components/common/RichTextInput.svelte) while the rest of
        # the tiptap suite is on v3. Drop this flag once both extensions are
        # bumped to v3.
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck || true
